    <script>
      // the splash's wordmark waits for its pixel font (1.5 s at most), so it never shows in a stand-in font
      (function (d) {
        var ok = function () { d.documentElement.classList.add('px-ready'); };
        setTimeout(ok, 1500);
        try { d.fonts.load('700 28px Silkscreen').then(ok, ok); } catch (e) { ok(); }
        // a first open gets the guide: its first picture and fonts start now, while the app loads
        try {
          if (localStorage.getItem('tt-tut') !== '1') {
            new Image().src = 'art/tut-1-brake.png';
            ['400 16px Silkscreen', '400 16px Geist', '800 16px Geist'].forEach(function (f) { d.fonts.load(f); });
          } else new Image().src = 'art/hero.png'; // the home's picture
        } catch (e) { /* storage blocked */ }
      })(document);
    </script>
